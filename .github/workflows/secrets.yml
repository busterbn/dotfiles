name: Secret scan

# gitleaks over the pushed commits (or the PR range). Findings are redacted and fail the job.
# On a hit: rotate the secret first, then remove it from the code and tell the owner (a history rewrite is the owner's decision).
# False positives go in .gitleaks.toml with a comment. Never bypass; same rule as the local pre-commit hook.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tar_name"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tar_name\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tar_name" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only the new commits; the whole history for a new branch, a force push or a manual run.
          opts=""
          if [ "$EVENT" = pull_request ]; then
            opts="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            opts="$BEFORE..$AFTER"
          fi
          gitleaks git --redact --no-banner ${opts:+--log-opts="$opts"}
